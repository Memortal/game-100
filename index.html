<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#fff9fb" />
<title>Find Goli — Brooklyn</title>
<meta name="description" content="Find Goli in a real Brooklyn tax lot." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--paper:#fff9fb;--ink:#171417;--muted:#81767b;--line:#eadfe4;--pink:#ee9fbb;--pink2:#ffd8e5;--yellow:#f4df8a;--white:#fff;--shadow:0 8px 26px rgba(48,25,37,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;position:relative}header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,249,251,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:1000}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.flower{width:34px;height:34px;display:grid;place-items:center;border-radius:999px;background:var(--pink2);font-size:18px;flex:none}h1{font-size:17px;letter-spacing:.14em;margin:0;font-weight:850;white-space:nowrap}.sub{font-size:11px;color:var(--muted);margin-top:2px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.9);min-height:44px;border-radius:999px;padding:0 14px;font:inherit;font-size:12px;font-weight:800;color:var(--ink)}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.stat{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}.label{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:850}.value{font-size:16px;font-weight:850;margin-top:2px;font-variant-numeric:tabular-nums}#map{height:100%;min-height:0;background:#fffdfd}.leaflet-container{font:inherit}.leaflet-tile{filter:saturate(.55) brightness(1.03)}.leaflet-control-zoom{border:1px solid var(--line)!important;box-shadow:none!important}.leaflet-control-zoom a{background:rgba(255,255,255,.95)!important;color:var(--ink)!important}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.78)!important}.guess-dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:var(--pink);box-shadow:0 2px 8px rgba(55,24,39,.24)}footer{z-index:1000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff9fb,rgba(255,249,251,.96));border-top:1px solid var(--line)}.clue{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:13px 15px;box-shadow:var(--shadow)}.clue strong{font-size:18px;line-height:1.08;display:block}.clue small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.3}.distance{min-width:82px;text-align:center;border-radius:17px;padding:9px 10px;background:#fff1f6;border:1px solid #f6d3df}.distance b{font-size:23px;display:block;line-height:1;font-variant-numeric:tabular-nums}.distance span{font-size:8px;letter-spacing:.1em;font-weight:900;color:#936274}.loading,.zoom-note{position:absolute;z-index:900;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;box-shadow:0 3px 12px rgba(30,20,25,.06)}.loading{top:50%;transform:translate(-50%,-50%);padding:10px 14px;font-size:12px;font-weight:800;display:none}.loading.show{display:block}.zoom-note{top:12px;padding:7px 11px;font-size:10px;color:var(--muted);pointer-events:none}.toast{position:absolute;z-index:1500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,330px);background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 20px 60px rgba(35,20,28,.16);display:none}.toast.show{display:block}.toast .big{font-size:54px}.toast h2{margin:8px 0 4px;font-size:24px}.toast p{margin:0;color:var(--muted);font-size:13px}.toast button{margin-top:16px;width:100%;min-height:48px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:inherit;font-weight:850}.petal{position:absolute;z-index:800;pointer-events:none;color:#f2b3c9;opacity:.62;font-size:36px}.petal.a{left:-8px;top:28%}.petal.b{right:-6px;bottom:18%;color:#ead36f;font-size:29px}@media(min-width:760px){#app{max-width:520px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}body{background:#f5eff2}}
</style>
</head>
<body>
<div id="app">
<header><div class="topline"><div class="brand"><div class="flower">🌸</div><div><h1>FIND GOLI</h1><div class="sub">somewhere in Brooklyn</div></div></div><button id="newGame" class="pill" type="button">NEW GOLI</button></div><div class="stats"><div class="stat"><div class="label">TIME</div><div id="time" class="value">00:00.0</div></div><div class="stat"><div class="label">TAPS</div><div id="taps" class="value">0</div></div><div class="stat"><div class="label">YOUR BEST</div><div id="best" class="value">—</div></div></div></header>
<div style="position:relative;min-height:0"><div id="map"></div><div id="zoomNote" class="zoom-note">zoom in to reveal real tax lots</div><div class="petal a">✿</div><div class="petal b">✿</div><div id="loading" class="loading">hiding Goli…</div></div>
<footer><div class="clue" aria-live="polite"><div><strong id="message">Loading Brooklyn…</strong><small id="detail">Real NYC tax lots · no API key needed.</small></div><div class="distance"><b id="distance">?</b><span>PARCELS BETWEEN</span></div></div></footer>
<div id="win" class="toast"><div class="big">🌸</div><h2>You found Goli.</h2><p id="winText"></p><button id="playAgain" type="button">FIND HER AGAIN</button></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const BASE='https://data.cityofnewyork.us/resource/i38t-6if2';
const $=id=>document.getElementById(id);
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:10,maxZoom:19,preferCanvas:true}).setView([40.6502,-73.9496],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
map.attributionControl.setPrefix(false);map.attributionControl.addAttribution('NYC Open Data / DOF');
const parcelLayer=L.geoJSON(null,{style:()=>({color:'#a99da3',weight:.55,fillColor:'#fff8fb',fillOpacity:.66}),onEachFeature:(f,l)=>l.on('click',e=>{L.DomEvent.stopPropagation(e);makeGuess(f)})}).addTo(map);
let goli=null,taps=0,running=false,won=false,start=0,raf=0,busy=false,lotCount=0,refreshTimer=0,guessMarkers=[];
let best=Number(localStorage.getItem('finding-goli-best')||0)||0;if(best)$('best').textContent=fmt(best);
function fmt(ms){const s=Math.max(0,ms)/1000,m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,'0')+':'+r.toFixed(1).padStart(4,'0')}
function tick(){if(!running)return;$('time').textContent=fmt(performance.now()-start);raf=requestAnimationFrame(tick)}
function startClock(){if(running||won)return;running=true;start=performance.now();tick()}
function stopClock(){running=false;if(raf)cancelAnimationFrame(raf)}
function setBusy(v,text){busy=v;$('loading').textContent=text||'working…';$('loading').classList.toggle('show',v)}
async function get(ext,params){const u=new URL(BASE+'.'+ext);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u.toString(),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('NYC Open Data '+r.status);return r.json()}
function center(f){return L.geoJSON(f).getBounds().getCenter()}
function escWktNum(n){return Number(n).toFixed(7)}
function boundsWkt(b){const w=escWktNum(b.getWest()),e=escWktNum(b.getEast()),s=escWktNum(b.getSouth()),n=escWktNum(b.getNorth());return `POLYGON((${w} ${s},${e} ${s},${e} ${n},${w} ${n},${w} ${s}))`}
async function ensureCount(){if(lotCount)return lotCount;const d=await get('json',{'$select':'count(*) as n','$where':"boro='3'"});lotCount=Number(d?.[0]?.n||0);if(!lotCount)throw new Error('No Brooklyn lots');return lotCount}
async function randomParcel(){const n=await ensureCount();for(let i=0;i<5;i++){const off=Math.floor(Math.random()*n);const d=await get('geojson',{'$select':'the_geom,objectid,bbl,block,lot,boro','$where':"boro='3'",'$order':'objectid','$limit':'1','$offset':String(off)});if(d.features?.[0])return d.features[0]}throw new Error('Could not choose parcel')}
async function refreshParcels(){clearTimeout(refreshTimer);if(map.getZoom()<15){parcelLayer.clearLayers();$('zoomNote').textContent='zoom in to reveal real tax lots';return}$('zoomNote').textContent='tap any visible tax lot';const wkt=boundsWkt(map.getBounds());try{const d=await get('geojson',{'$select':'the_geom,objectid,bbl,block,lot,boro','$where':`boro='3' AND intersects(the_geom,'${wkt}')`,'$limit':'2000'});parcelLayer.clearLayers();parcelLayer.addData(d)}catch(e){console.warn(e);$('zoomNote').textContent='move or zoom slightly to reload tax lots'}}
async function crossedCount(a,b){const line=`LINESTRING(${escWktNum(a.lng)} ${escWktNum(a.lat)},${escWktNum(b.lng)} ${escWktNum(b.lat)})`;const d=await get('json',{'$select':'count(*) as n','$where':`boro='3' AND intersects(the_geom,'${line}')`});return Math.max(0,Number(d?.[0]?.n||0)-2)}
function addMarker(c){const icon=L.divIcon({className:'',html:'<div class="guess-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});guessMarkers.push(L.marker(c,{icon,interactive:false}).addTo(map))}
async function newGame(){try{setBusy(true,'hiding Goli…');stopClock();won=false;taps=0;$('taps').textContent='0';$('time').textContent='00:00.0';$('distance').textContent='?';$('win').classList.remove('show');guessMarkers.forEach(m=>map.removeLayer(m));guessMarkers=[];$('message').textContent='Finding a hiding place…';$('detail').textContent='Using NYC Open Data tax lots.';const f=await randomParcel();goli={feature:f,id:String(f.properties.objectid),center:center(f)};$('message').textContent='Zoom in and tap a parcel.';$('detail').textContent='Each clue counts the real tax lots crossed between your parcel and Goli.';setBusy(false);refreshParcels()}catch(e){console.error(e);setBusy(false);$('message').textContent='NYC Open Data is taking too long.';$('detail').textContent='Tap NEW GOLI to retry.'}}
async function makeGuess(f){if(busy||won||!goli)return;try{setBusy(true,'counting parcels…');startClock();taps++;$('taps').textContent=String(taps);const c=center(f);addMarker(c);if(String(f.properties.objectid)===goli.id){finish(c);setBusy(false);return}const n=await crossedCount(c,goli.center);$('distance').textContent=n.toLocaleString();$('message').textContent=n===0?'You are right beside Goli.':`Goli is ${n.toLocaleString()} parcel${n===1?'':'s'} away.`;$('detail').textContent=n<5?'Very close 🌸':n<20?'Getting warm ✿':n<70?'Closer…':'Keep searching Brooklyn.';setBusy(false)}catch(e){console.error(e);setBusy(false);$('message').textContent='That guess did not go through.';$('detail').textContent='Tap the parcel again.'}}
function finish(c){won=true;stopClock();const elapsed=performance.now()-start;$('time').textContent=fmt(elapsed);$('distance').textContent='0';$('message').textContent='FOUND GOLI 🌸';$('detail').textContent='Exact Brooklyn tax lot.';if(!best||elapsed<best){best=elapsed;localStorage.setItem('finding-goli-best',String(best));$('best').textContent=fmt(best)}$('winText').textContent=`${fmt(elapsed)} · ${taps} tap${taps===1?'':'s'} · BBL ${goli.feature.properties.bbl||''}`;$('win').classList.add('show');map.flyTo(c,18,{duration:.7})}
map.on('moveend zoomend',()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(refreshParcels,250)});
map.on('click',()=>{if(map.getZoom()<15){$('message').textContent='Zoom in a little more.';$('detail').textContent='Individual tax lots appear at zoom level 15.'}});
$('newGame').addEventListener('click',newGame);$('playAgain').addEventListener('click',newGame);
newGame();
})();
</script>
</body>
</html>
