<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#fff9fb" />
<title>Find Goli — Brooklyn</title>
<meta name="description" content="Goli is hiding in a real Brooklyn tax lot. Find her as fast as you can." />
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--paper:#fff9fb;--ink:#171417;--muted:#81767b;--line:#eadfe4;--pink:#ee9fbb;--pink2:#ffd8e5;--yellow:#f4df8a;--white:#fff;--shadow:0 8px 26px rgba(48,25,37,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;position:relative}header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,249,251,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:1000}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.flower{width:34px;height:34px;display:grid;place-items:center;border-radius:999px;background:var(--pink2);font-size:18px;flex:none}h1{font-size:17px;letter-spacing:.14em;margin:0;font-weight:850;white-space:nowrap}.sub{font-size:11px;color:var(--muted);margin-top:2px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.88);min-height:44px;border-radius:999px;padding:0 14px;font:inherit;font-size:12px;font-weight:800;color:var(--ink);touch-action:manipulation}.pill:active{transform:scale(.98)}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.stat{background:rgba(255,255,255,.74);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}.label{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:850}.value{font-size:16px;font-weight:850;margin-top:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}#map{height:100%;min-height:0;background:#fffdfd;z-index:1}.leaflet-container{font:inherit;background:#fffdfd}.leaflet-tile{filter:saturate(.45) brightness(1.04) sepia(.05)}.leaflet-control-zoom{border:1px solid var(--line)!important;box-shadow:none!important}.leaflet-control-zoom a{background:rgba(255,255,255,.94)!important;color:var(--ink)!important;border-bottom:1px solid var(--line)!important}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.72)!important}.guess-dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:var(--pink);box-shadow:0 2px 8px rgba(55,24,39,.24)}.leaflet-interactive{transition:fill .12s ease,stroke .12s ease}footer{z-index:1000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff9fb,rgba(255,249,251,.96));border-top:1px solid var(--line)}.clue{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:13px 15px;box-shadow:var(--shadow)}.clue strong{font-size:18px;line-height:1.08;display:block}.clue small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.3}.distance{min-width:80px;text-align:center;border-radius:17px;padding:9px 10px;background:#fff1f6;border:1px solid #f6d3df}.distance b{font-size:23px;display:block;line-height:1;font-variant-numeric:tabular-nums}.distance span{font-size:8px;letter-spacing:.1em;font-weight:900;color:#936274}.toast{position:absolute;z-index:1500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,330px);background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 20px 60px rgba(35,20,28,.16);display:none}.toast.show{display:block;animation:pop .22s ease-out}.toast .big{font-size:54px;line-height:1}.toast h2{margin:8px 0 4px;font-size:24px}.toast p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.toast button{margin-top:16px;width:100%;min-height:48px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:inherit;font-weight:850;font-size:14px}.loading{position:absolute;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:800;box-shadow:var(--shadow);display:none}.loading.show{display:block}.zoom-note{position:absolute;z-index:900;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:10px;color:var(--muted);pointer-events:none;white-space:nowrap;box-shadow:0 3px 12px rgba(30,20,25,.05)}.petal{position:absolute;z-index:800;pointer-events:none;color:#f2b3c9;opacity:.62;font-size:36px;line-height:1}.petal.a{left:-8px;top:28%}.petal.b{right:-6px;bottom:18%;color:#ead36f;font-size:29px}@keyframes pop{from{transform:translate(-50%,-50%) scale(.93);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@media(min-width:760px){#app{max-width:520px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}body{background:#f5eff2}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header><div class="topline"><div class="brand"><div class="flower">🌸</div><div><h1>FIND GOLI</h1><div class="sub">somewhere in Brooklyn</div></div></div><button id="newGame" class="pill" type="button">NEW GOLI</button></div><div class="stats"><div class="stat"><div class="label">TIME</div><div id="time" class="value">00:00.0</div></div><div class="stat"><div class="label">TAPS</div><div id="taps" class="value">0</div></div><div class="stat"><div class="label">YOUR BEST</div><div id="best" class="value">—</div></div></div></header>
<div style="position:relative;min-height:0"><div id="map" aria-label="Brooklyn tax lot map"></div><div id="zoomNote" class="zoom-note">tap anywhere · zoom in for tax lots</div><div class="petal a">✿</div><div class="petal b">✿</div><div id="loading" class="loading">hiding Goli…</div></div>
<footer><div class="clue" aria-live="polite"><div><strong id="message">Loading Brooklyn…</strong><small id="detail">Using NYC Digital Tax Map parcels.</small></div><div class="distance"><b id="distance">?</b><span>PARCELS BETWEEN</span></div></div></footer>
<div id="win" class="toast" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="big">🌸</div><h2 id="winTitle">You found Goli.</h2><p id="winText"></p><button id="playAgain" type="button">FIND HER AGAIN</button></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const SERVICE='https://services6.arcgis.com/yG5s3afENB5iO9fj/ArcGIS/rest/services/DTM_ETL_DAILY_A/FeatureServer/0/query';
const $=id=>document.getElementById(id);
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:10,maxZoom:19,preferCanvas:true}).setView([40.6502,-73.9496],11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution('NYC DOF Digital Tax Map');
const parcelLayer=L.geoJSON(null,{style:()=>({color:'#a99da3',weight:.55,fillColor:'#fff8fb',fillOpacity:.62}),onEachFeature:(f,l)=>l.on('click',e=>{L.DomEvent.stopPropagation(e);makeGuess(f)})}).addTo(map);
let goli=null,taps=0,running=false,won=false,start=0,raf=0,guessMarkers=[],busy=false,refreshTimer=0;
let best=Number(localStorage.getItem('finding-goli-best')||0)||0;if(best)$('best').textContent=fmt(best);
function fmt(ms){const s=Math.max(0,ms)/1000,m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,'0')+':'+r.toFixed(1).padStart(4,'0')}
function tick(){if(!running)return;$('time').textContent=fmt(performance.now()-start);raf=requestAnimationFrame(tick)}
function startClock(){if(running||won)return;running=true;start=performance.now();tick()}
function stopClock(){running=false;if(raf)cancelAnimationFrame(raf)}
function setBusy(v,text){busy=v;$('loading').textContent=text||'looking through Brooklyn…';$('loading').classList.toggle('show',v)}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='fg_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>cleanup(new Error('NYC map timeout')),12000);function cleanup(err,data){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data)}window[cb]=data=>cleanup(null,data);params.callback=cb;params.f='json';const q=new URLSearchParams(params);script.src=SERVICE+'?'+q.toString();script.onerror=()=>cleanup(new Error('NYC map request failed'));document.head.appendChild(script)})}
async function query(params){const p={...params,f:'json'};try{const q=new URLSearchParams(p);const r=await fetch(SERVICE+'?'+q.toString(),{mode:'cors',cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.error)throw new Error(d.error.message||'NYC map error');return d}catch(e){const d=await jsonp({...params});if(d.error)throw new Error(d.error.message||'NYC map error');return d}}
function toGeo(feature){if(!feature||!feature.geometry||!feature.geometry.rings)return null;return {type:'Feature',properties:feature.attributes||{},geometry:{type:'Polygon',coordinates:feature.geometry.rings}}}
function center(feature){const gj=feature.type==='Feature'&&feature.geometry?feature:toGeo(feature);if(!gj)return null;return L.geoJSON(gj).getBounds().getCenter()}
async function nearby(latlng,radius=.0015,limit=60){const env=[latlng.lng-radius,latlng.lat-radius,latlng.lng+radius,latlng.lat+radius].join(',');const d=await query({where:"BORO='3'",geometry:env,geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'OBJECTID,BBL,BLOCK,LOT,BORO',returnGeometry:'true',outSR:'4326',resultRecordCount:String(limit)});return d.features||[]}
async function nearestFeature(latlng,radius=.0015){let fs=await nearby(latlng,radius,60);if(!fs.length&&radius<.006)fs=await nearby(latlng,.006,80);if(!fs.length)return null;let winner=null,score=Infinity;for(const f of fs){const c=center(f);if(!c)continue;const dx=(c.lng-latlng.lng)*Math.cos(latlng.lat*Math.PI/180),dy=c.lat-latlng.lat,s=dx*dx+dy*dy;if(s<score){score=s;winner=f}}return winner}
async function randomBrooklynParcel(){for(let i=0;i<16;i++){const p=L.latLng(40.575+Math.random()*.17,-74.045+Math.random()*.205);const fs=await nearby(p,.0045,80);if(fs.length)return fs[Math.floor(Math.random()*fs.length)]}throw new Error('Could not choose a Brooklyn parcel')}
async function crossedCount(a,b){const geom={paths:[[[a.lng,a.lat],[b.lng,b.lat]]],spatialReference:{wkid:4326}};const d=await query({where:"BORO='3'",geometry:JSON.stringify(geom),geometryType:'esriGeometryPolyline',inSR:'4326',spatialRel:'esriSpatialRelIntersects',returnCountOnly:'true'});return Math.max(0,(Number(d.count)||0)-2)}
function addGuessMarker(c){const icon=L.divIcon({className:'',html:'<div class="guess-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});guessMarkers.push(L.marker(c,{icon,interactive:false}).addTo(map))}
async function refreshParcels(){if(map.getZoom()<15){parcelLayer.clearLayers();$('zoomNote').textContent='tap anywhere · zoom in for tax lots';return}$('zoomNote').textContent='tap any visible tax lot';const b=map.getBounds(),env=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',');try{const d=await query({where:"BORO='3'",geometry:env,geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'OBJECTID,BBL,BLOCK,LOT,BORO',returnGeometry:'true',outSR:'4326',resultRecordCount:'2000'});parcelLayer.clearLayers();parcelLayer.addData((d.features||[]).map(toGeo).filter(Boolean))}catch(e){console.warn('parcel draw',e)}}
async function newGame(){try{setBusy(true,'hiding Goli…');stopClock();won=false;taps=0;$('taps').textContent='0';$('time').textContent='00:00.0';$('distance').textContent='?';$('message').textContent='Finding a hiding place…';$('detail').textContent='Using real Brooklyn tax lots.';$('win').classList.remove('show');guessMarkers.forEach(m=>map.removeLayer(m));guessMarkers=[];const f=await randomBrooklynParcel(),c=center(f);if(!c)throw new Error('No parcel geometry');goli={id:Number(f.attributes.OBJECTID),feature:f,center:c};$('message').textContent='Tap a parcel to start.';$('detail').textContent='The number tells you how many real tax lots are between you and Goli.';setBusy(false)}catch(e){console.error(e);setBusy(false);$('message').textContent='Brooklyn data did not respond.';$('detail').textContent='Tap NEW GOLI to retry. The map itself should still work.'}}
async function makeGuess(feature){if(busy||won||!goli||!feature)return;try{setBusy(true,'counting parcels…');startClock();taps++;$('taps').textContent=String(taps);const props=feature.properties||feature.attributes||{},id=Number(props.OBJECTID),c=center(feature);if(!c)throw new Error('No parcel center');addGuessMarker(c);if(id===goli.id){win(c);setBusy(false);return}const n=await crossedCount(c,goli.center);$('distance').textContent=n.toLocaleString();$('message').textContent=n===0?'Almost there.':'Goli is '+n.toLocaleString()+' parcel'+(n===1?'':'s')+' away.';$('detail').textContent=n<5?'Very close 🌸':n<20?'Warm ✿':n<70?'Getting closer…':'Keep searching across Brooklyn.';setBusy(false)}catch(e){console.error(e);setBusy(false);$('message').textContent='That tap did not go through.';$('detail').textContent='Try another parcel.'}}
function win(c){won=true;stopClock();const elapsed=performance.now()-start;$('time').textContent=fmt(elapsed);$('distance').textContent='0';$('message').textContent='FOUND GOLI 🌸';$('detail').textContent='You found the exact Brooklyn tax lot.';if(!best||elapsed<best){best=elapsed;localStorage.setItem('finding-goli-best',String(best));$('best').textContent=fmt(best)}$('winText').textContent=fmt(elapsed)+' · '+taps+' tap'+(taps===1?'':'s')+' · BBL '+((goli.feature.attributes||{}).BBL||'');$('win').classList.add('show');map.flyTo(c,18,{duration:.8})}
map.on('click',async e=>{if(busy||won||!goli)return;try{setBusy(true,'finding that tax lot…');const f=await nearestFeature(e.latlng);setBusy(false);if(f)makeGuess(f);else{$('message').textContent='No tax lot there.';$('detail').textContent='Try a nearby block.'}}catch(err){console.error(err);setBusy(false);$('message').textContent='That area did not load.';$('detail').textContent='Try another part of Brooklyn.'}});
map.on('moveend',()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(refreshParcels,220)});
$('newGame').addEventListener('click',newGame);$('playAgain').addEventListener('click',newGame);
refreshParcels();newGame();
})();
</script>
</body>
</html>
