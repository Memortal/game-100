<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff9fb">
<title>Find Goli — Brooklyn</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--paper:#fff9fb;--ink:#171417;--muted:#81767b;--line:#eadfe4;--pink:#ee9fbb;--pink2:#ffd8e5;--yellow:#f4df8a;--white:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}header{z-index:1000;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,249,251,.96);border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.flower{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pink2)}h1{font-size:17px;letter-spacing:.14em;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}.btn{min-height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:14px;padding:8px 10px}.label{font-size:9px;letter-spacing:.13em;color:var(--muted);font-weight:800}.value{font-size:16px;font-weight:850;font-variant-numeric:tabular-nums;margin-top:2px}main{position:relative;min-height:0}#map{height:100%}.leaflet-tile{filter:saturate(.45) brightness(1.06) sepia(.04)}.leaflet-control-attribution{font-size:8px!important}.note{position:absolute;z-index:900;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:10px;color:var(--muted);white-space:nowrap}.loading{display:none;position:absolute;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:800}.loading.show{display:block}.petal{position:absolute;z-index:850;pointer-events:none;font-size:34px;color:#f2b3c9}.petal.a{left:-8px;top:28%}.petal.b{right:-5px;bottom:20%;color:#ead36f}footer{z-index:1000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff9fb;border-top:1px solid var(--line)}.clue{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:13px 15px}.clue strong{display:block;font-size:18px}.clue small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.dist{min-width:82px;text-align:center;background:#fff1f6;border:1px solid #f6d3df;border-radius:17px;padding:9px}.dist b{display:block;font-size:23px}.dist span{font-size:8px;letter-spacing:.1em;font-weight:900;color:#936274}.guess{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:var(--pink);box-shadow:0 2px 8px rgba(55,24,39,.24)}.win{display:none;position:absolute;z-index:1600;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,330px);background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 18px 60px rgba(40,20,30,.17)}.win.show{display:block}.win .big{font-size:54px}.win h2{margin:6px 0}.win p{color:var(--muted);font-size:13px}.win button{width:100%;min-height:48px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:850;margin-top:14px}@media(min-width:760px){#app{max-width:520px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
<header><div class="top"><div class="brand"><div class="flower">🌸</div><div><h1>FIND GOLI</h1><div class="sub">somewhere in Brooklyn</div></div></div><button id="newGame" class="btn">NEW GOLI</button></div><div class="stats"><div class="stat"><div class="label">TIME</div><div id="time" class="value">00:00.0</div></div><div class="stat"><div class="label">TAPS</div><div id="taps" class="value">0</div></div><div class="stat"><div class="label">YOUR BEST</div><div id="best" class="value">—</div></div></div></header>
<main><div id="map"></div><div id="note" class="note">tap anywhere · zoom in for tax lots</div><div class="petal a">✿</div><div class="petal b">✿</div><div id="loading" class="loading">hiding Goli…</div></main>
<footer><div class="clue"><div><strong id="message">Loading Brooklyn…</strong><small id="detail">Using NYC Digital Tax Map parcels.</small></div><div class="dist"><b id="distance">?</b><span>PARCELS BETWEEN</span></div></div></footer>
<div id="win" class="win"><div class="big">🌸</div><h2>You found Goli.</h2><p id="winText"></p><button id="again">FIND HER AGAIN</button></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const API='https://services6.arcgis.com/yG5s3afENB5iO9fj/ArcGIS/rest/services/DTM_ETL_DAILY_A/FeatureServer/0/query';
const $=id=>document.getElementById(id);
const map=L.map('map',{minZoom:10,maxZoom:19,preferCanvas:true}).setView([40.6502,-73.9496],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
map.attributionControl.setPrefix(false);map.attributionControl.addAttribution('NYC DOF Digital Tax Map');
const parcels=L.geoJSON(null,{style:()=>({color:'#9e9298',weight:.65,fillColor:'#fff8fb',fillOpacity:.48}),onEachFeature:(f,l)=>l.on('click',e=>{L.DomEvent.stopPropagation(e);guess(f)})}).addTo(map);
let goli=null,taps=0,start=0,running=false,won=false,raf=0,busy=false,markers=[],refreshTimer=0;
let best=Number(localStorage.getItem('fg-best')||0)||0;if(best)$('best').textContent=fmt(best);
function fmt(ms){const s=ms/1000,m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,'0')+':'+r.toFixed(1).padStart(4,'0')}
function clock(){if(!running)return;$('time').textContent=fmt(performance.now()-start);raf=requestAnimationFrame(clock)}
function begin(){if(running||won)return;running=true;start=performance.now();clock()}
function stop(){running=false;if(raf)cancelAnimationFrame(raf)}
function busyState(v,t){busy=v;$('loading').textContent=t||'working…';$('loading').classList.toggle('show',v)}
async function request(params){const q=new URLSearchParams({...params,f:'json'});const r=await fetch(API+'?'+q,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.error)throw new Error(d.error.message||'NYC data error');return d}
function gj(f){if(f.type==='Feature')return f;if(!f?.geometry?.rings)return null;return{type:'Feature',properties:f.attributes||{},geometry:{type:'Polygon',coordinates:f.geometry.rings}}}
function ctr(f){const g=gj(f);return g?L.geoJSON(g).getBounds().getCenter():null}
async function around(p,r=.002,limit=80){const env=[p.lng-r,p.lat-r,p.lng+r,p.lat+r].join(',');const d=await request({where:"BORO='3'",geometry:env,geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'OBJECTID,BBL,BLOCK,LOT,BORO',returnGeometry:'true',outSR:'4326',resultRecordCount:String(limit)});return d.features||[]}
async function nearest(p){let fs=await around(p,.0017,60);if(!fs.length)fs=await around(p,.006,100);let bestF=null,bestD=Infinity;for(const f of fs){const c=ctr(f);if(!c)continue;const dx=(c.lng-p.lng)*Math.cos(p.lat*Math.PI/180),dy=c.lat-p.lat,d=dx*dx+dy*dy;if(d<bestD){bestD=d;bestF=f}}return bestF}
async function randomParcel(){for(let i=0;i<18;i++){const p=L.latLng(40.575+Math.random()*.17,-74.045+Math.random()*.205);const fs=await around(p,.0045,80);if(fs.length)return fs[Math.floor(Math.random()*fs.length)]}throw new Error('No parcel found')}
async function countBetween(a,b){const geom={paths:[[[a.lng,a.lat],[b.lng,b.lat]]],spatialReference:{wkid:4326}};const d=await request({where:"BORO='3'",geometry:JSON.stringify(geom),geometryType:'esriGeometryPolyline',inSR:'4326',spatialRel:'esriSpatialRelIntersects',returnCountOnly:'true'});return Math.max(0,(Number(d.count)||0)-2)}
function mark(c){const icon=L.divIcon({className:'',html:'<div class="guess"></div>',iconSize:[18,18],iconAnchor:[9,9]});markers.push(L.marker(c,{icon,interactive:false}).addTo(map))}
async function drawParcels(){if(map.getZoom()<15){parcels.clearLayers();$('note').textContent='tap anywhere · zoom in for tax lots';return}$('note').textContent='tap any visible tax lot';const b=map.getBounds(),env=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',');try{const d=await request({where:"BORO='3'",geometry:env,geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'OBJECTID,BBL,BLOCK,LOT,BORO',returnGeometry:'true',outSR:'4326',resultRecordCount:'2000'});parcels.clearLayers();parcels.addData((d.features||[]).map(gj).filter(Boolean))}catch(e){console.warn(e)}}
async function newGame(){try{busyState(true,'hiding Goli…');stop();won=false;taps=0;$('taps').textContent='0';$('time').textContent='00:00.0';$('distance').textContent='?';$('win').classList.remove('show');markers.forEach(m=>map.removeLayer(m));markers=[];$('message').textContent='Finding a hiding place…';const f=await randomParcel(),c=ctr(f);goli={id:Number(f.attributes.OBJECTID),feature:f,center:c};$('message').textContent='Tap a parcel to start.';$('detail').textContent='The clue counts real tax lots between your guess and Goli.';busyState(false)}catch(e){console.error(e);busyState(false);$('message').textContent='Brooklyn data did not respond.';$('detail').textContent='Tap NEW GOLI to retry.'}}
async function guess(f){if(busy||won||!goli||!f)return;try{busyState(true,'counting parcels…');begin();taps++;$('taps').textContent=taps;const a=f.attributes||f.properties||{},c=ctr(f);mark(c);if(Number(a.OBJECTID)===goli.id){finish(c);busyState(false);return}const n=await countBetween(c,goli.center);$('distance').textContent=n.toLocaleString();$('message').textContent=n===0?'Almost there.':'Goli is '+n.toLocaleString()+' parcel'+(n===1?'':'s')+' away.';$('detail').textContent=n<5?'Very close 🌸':n<20?'Getting warm ✿':n<70?'Closer…':'Keep searching across Brooklyn.';busyState(false)}catch(e){console.error(e);busyState(false);$('message').textContent='That tap failed.';$('detail').textContent='Try another parcel.'}}
function finish(c){won=true;stop();const elapsed=performance.now()-start;$('time').textContent=fmt(elapsed);$('distance').textContent='0';$('message').textContent='FOUND GOLI 🌸';$('detail').textContent='Exact Brooklyn tax lot found.';if(!best||elapsed<best){best=elapsed;localStorage.setItem('fg-best',best);$('best').textContent=fmt(best)}const a=goli.feature.attributes||{};$('winText').textContent=fmt(elapsed)+' · '+taps+' tap'+(taps===1?'':'s')+(a.BBL?' · BBL '+a.BBL:'');$('win').classList.add('show');map.flyTo(c,18,{duration:.8})}
map.on('click',async e=>{if(busy||won||!goli)return;try{busyState(true,'finding that parcel…');const f=await nearest(e.latlng);busyState(false);if(f)guess(f);else{$('message').textContent='No tax lot there.';$('detail').textContent='Try a nearby Brooklyn block.'}}catch(err){console.error(err);busyState(false)}});
map.on('moveend zoomend',()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(drawParcels,250)});
$('newGame').onclick=newGame;$('again').onclick=newGame;setTimeout(()=>map.invalidateSize(),100);drawParcels();newGame();
})();
</script>
</body>
</html>
