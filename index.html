<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#fff9fb" />
<title>Find Goli — Brooklyn</title>
<meta name="description" content="Find Goli hidden in a real Brooklyn tax lot." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--paper:#fff9fb;--ink:#191619;--muted:#81767b;--line:#eadfe4;--pink:#ee9fbb;--pink2:#ffd8e5;--yellow:#f4df8a;--card:#fff;--shadow:0 8px 26px rgba(48,25,37,.08)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;position:relative}header{z-index:1000;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,249,251,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:9px;align-items:center;min-width:0}.flower{width:34px;height:34px;display:grid;place-items:center;border-radius:999px;background:var(--pink2);font-size:18px}.title{font-weight:900;letter-spacing:.15em;font-size:17px}.sub{color:var(--muted);font-size:11px;margin-top:2px}.btn{min-height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 15px;font:inherit;font-size:12px;font-weight:850;color:var(--ink)}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.stat{border:1px solid var(--line);background:rgba(255,255,255,.78);border-radius:14px;padding:8px 10px}.label{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:900}.value{font-size:16px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}#mapWrap{min-height:0;position:relative}#map{height:100%;background:#fffdfd}.leaflet-container{font:inherit}.leaflet-tile{filter:saturate(.55) brightness(1.04)}.leaflet-control-zoom{border:1px solid var(--line)!important;box-shadow:none!important}.leaflet-control-zoom a{background:rgba(255,255,255,.95)!important;color:var(--ink)!important;border-bottom:1px solid var(--line)!important}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.72)!important}.leaflet-interactive{transition:fill .12s,stroke .12s}.note{position:absolute;z-index:900;top:12px;left:50%;transform:translateX(-50%);padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.94);font-size:10px;color:var(--muted);white-space:nowrap;pointer-events:none;box-shadow:0 3px 12px rgba(30,20,25,.05)}.petal{position:absolute;z-index:800;pointer-events:none;color:#f1b0c7;opacity:.7;font-size:34px}.petal.a{left:-6px;top:31%}.petal.b{right:-5px;bottom:17%;color:#ead36f;font-size:28px}.loading{display:none;position:absolute;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.97);box-shadow:var(--shadow);font-size:12px;font-weight:800;white-space:nowrap}.loading.show{display:block}.guess-dot{width:18px;height:18px;border-radius:50%;background:var(--pink);border:3px solid #fff;box-shadow:0 2px 8px rgba(55,24,39,.25)}footer{z-index:1000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(to top,#fff9fb,rgba(255,249,251,.96))}.clue{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:var(--shadow)}.clue strong{display:block;font-size:18px;line-height:1.08}.clue small{display:block;margin-top:4px;font-size:11px;color:var(--muted);line-height:1.3}.distance{min-width:82px;text-align:center;border:1px solid #f6d3df;border-radius:17px;background:#fff1f6;padding:9px 10px}.distance b{display:block;font-size:23px;line-height:1;font-variant-numeric:tabular-nums}.distance span{font-size:8px;letter-spacing:.1em;font-weight:900;color:#936274}.win{display:none;position:absolute;z-index:1600;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,330px);padding:24px 20px;text-align:center;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.98);box-shadow:0 20px 60px rgba(35,20,28,.16)}.win.show{display:block}.win .big{font-size:54px}.win h2{margin:8px 0 4px;font-size:24px}.win p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.win button{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:850}@media(min-width:760px){#app{max-width:520px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}body{background:#f5eff2}}
</style>
</head>
<body>
<div id="app">
<header><div class="top"><div class="brand"><div class="flower">🌸</div><div><div class="title">FIND GOLI</div><div class="sub">somewhere in Brooklyn</div></div></div><button class="btn" id="newGame" type="button">NEW GOLI</button></div><div class="stats"><div class="stat"><div class="label">TIME</div><div class="value" id="time">00:00.0</div></div><div class="stat"><div class="label">TAPS</div><div class="value" id="taps">0</div></div><div class="stat"><div class="label">YOUR BEST</div><div class="value" id="best">—</div></div></div></header>
<div id="mapWrap"><div id="map"></div><div class="note" id="note">tap anywhere · zoom in for tax lots</div><div class="petal a">✿</div><div class="petal b">✿</div><div class="loading" id="loading">hiding Goli…</div></div>
<footer><div class="clue" aria-live="polite"><div><strong id="message">Loading Brooklyn…</strong><small id="detail">Using current NYC MapPLUTO tax lots.</small></div><div class="distance"><b id="distance">?</b><span>PARCELS BETWEEN</span></div></div></footer>
<div class="win" id="win" role="dialog" aria-modal="true"><div class="big">🌸</div><h2>You found Goli.</h2><p id="winText"></p><button id="again" type="button">FIND HER AGAIN</button></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.16/dist/esri-leaflet.js"></script>
<script>
(()=>{
const URL='https://services5.arcgis.com/GfwWNkhOj9bNBqoJ/arcgis/rest/services/MAPPLUTO/FeatureServer/0';
const $=id=>document.getElementById(id);
const brooklynBounds=L.latLngBounds([40.565,-74.045],[40.748,-73.833]);
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:10,maxZoom:19,preferCanvas:true,maxBounds:L.latLngBounds([40.50,-74.12],[40.81,-73.75]),maxBoundsViscosity:.65});
map.fitBounds(brooklynBounds,{padding:[8,8]});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
map.attributionControl.setPrefix(false); map.attributionControl.addAttribution('NYC DCP MapPLUTO');
const parcels=L.esri.featureLayer({url:URL,where:'BoroCode = 3',minZoom:15,simplifyFactor:.55,precision:5,fields:['OBJECTID','BBL','Block','Lot','Latitude','Longitude','BoroCode'],style:()=>({color:'#a99da3',weight:.7,fillColor:'#fff6fa',fillOpacity:.32})}).addTo(map);
let goli=null,taps=0,running=false,won=false,start=0,raf=0,busy=false,markers=[];
let best=Number(localStorage.getItem('finding-goli-best')||0)||0;if(best)$('best').textContent=fmt(best);
function fmt(ms){const s=Math.max(0,ms)/1000,m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,'0')+':'+r.toFixed(1).padStart(4,'0')}
function tick(){if(!running)return;$('time').textContent=fmt(performance.now()-start);raf=requestAnimationFrame(tick)}
function startClock(){if(!running&&!won){running=true;start=performance.now();tick()}}
function stopClock(){running=false;if(raf)cancelAnimationFrame(raf)}
function setBusy(v,t){busy=v;$('loading').textContent=t||'working…';$('loading').classList.toggle('show',v)}
async function api(params,timeout=9000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const q=new URLSearchParams({...params,f:'json'});const r=await fetch(URL+'/query?'+q.toString(),{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.error)throw new Error(d.error.message||'MapPLUTO error');return d}finally{clearTimeout(timer)}}
async function chooseGoli(){const c=await api({where:'BoroCode = 3',returnCountOnly:'true'},6500);const count=Number(c.count)||0;if(!count)throw new Error('No Brooklyn lots');for(let tries=0;tries<8;tries++){const offset=Math.floor(Math.random()*count);const d=await api({where:'BoroCode = 3',outFields:'OBJECTID,BBL,Block,Lot,Latitude,Longitude',returnGeometry:'false',orderByFields:'OBJECTID',resultOffset:String(offset),resultRecordCount:'1'},6500);const a=d.features&&d.features[0]&&d.features[0].attributes;if(a&&Number.isFinite(Number(a.Latitude))&&Number.isFinite(Number(a.Longitude)))return {id:Number(a.OBJECTID),bbl:String(Math.trunc(Number(a.BBL))),lat:Number(a.Latitude),lng:Number(a.Longitude),block:a.Block,lot:a.Lot};}throw new Error('Could not pick lot')}
async function nearestLot(latlng){const d=.0015,env=[latlng.lng-d,latlng.lat-d,latlng.lng+d,latlng.lat+d].join(',');const r=await api({where:'BoroCode = 3',geometry:env,geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'OBJECTID,BBL,Block,Lot,Latitude,Longitude',returnGeometry:'false',resultRecordCount:'80'},7000);let bestF=null,bestD=Infinity;for(const f of r.features||[]){const a=f.attributes||{},lat=Number(a.Latitude),lng=Number(a.Longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;const dx=(lng-latlng.lng)*Math.cos(latlng.lat*Math.PI/180),dy=lat-latlng.lat,s=dx*dx+dy*dy;if(s<bestD){bestD=s;bestF=a}}return bestF}
async function betweenCount(a,b){const geom={paths:[[[a.lng,a.lat],[b.lng,b.lat]]],spatialReference:{wkid:4326}};const d=await api({where:'BoroCode = 3',geometry:JSON.stringify(geom),geometryType:'esriGeometryPolyline',inSR:'4326',spatialRel:'esriSpatialRelIntersects',returnCountOnly:'true'},8000);return Math.max(0,(Number(d.count)||0)-2)}
function addMarker(latlng){const icon=L.divIcon({className:'',html:'<div class="guess-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});markers.push(L.marker(latlng,{icon,interactive:false}).addTo(map))}
async function newGame(){setBusy(true,'hiding Goli…');stopClock();won=false;taps=0;$('taps').textContent='0';$('time').textContent='00:00.0';$('distance').textContent='?';$('message').textContent='Hiding Goli…';$('detail').textContent='Choosing one real Brooklyn tax lot.';$('win').classList.remove('show');markers.forEach(m=>map.removeLayer(m));markers=[];try{goli=await chooseGoli();$('message').textContent='Tap a parcel to start.';$('detail').textContent='The clue is the number of tax lots crossed between your guess and Goli.';}catch(e){console.error(e);goli=null;$('message').textContent='MapPLUTO did not respond.';$('detail').textContent='Tap NEW GOLI to retry.';}finally{setBusy(false)}}
async function guessAttrs(a){if(!a||!goli||busy||won)return;const lat=Number(a.Latitude),lng=Number(a.Longitude),id=Number(a.OBJECTID);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;setBusy(true,'counting tax lots…');startClock();taps++;$('taps').textContent=String(taps);addMarker([lat,lng]);try{if(id===goli.id){win({lat,lng});return}const n=await betweenCount({lat,lng},{lat:goli.lat,lng:goli.lng});$('distance').textContent=n.toLocaleString();$('message').textContent=n===0?'Almost there.':`Goli is ${n.toLocaleString()} parcel${n===1?'':'s'} away.`;$('detail').textContent=n<5?'Very close 🌸':n<20?'Getting warm ✿':n<70?'Closer…':'Keep searching across Brooklyn.';}catch(e){console.error(e);$('message').textContent='That clue timed out.';$('detail').textContent='Your tap still counted — try another parcel.';}finally{setBusy(false)}}
function win(pos){won=true;stopClock();const elapsed=performance.now()-start;$('time').textContent=fmt(elapsed);$('distance').textContent='0';$('message').textContent='FOUND GOLI 🌸';$('detail').textContent='Exact tax lot found.';if(!best||elapsed<best){best=elapsed;localStorage.setItem('finding-goli-best',String(best));$('best').textContent=fmt(best)}$('winText').textContent=`${fmt(elapsed)} · ${taps} tap${taps===1?'':'s'} · BBL ${goli.bbl}`;$('win').classList.add('show');map.flyTo([pos.lat,pos.lng],18,{duration:.7})}
parcels.on('click',e=>{if(e.layer&&e.layer.feature&&e.layer.feature.properties){L.DomEvent.stopPropagation(e);guessAttrs(e.layer.feature.properties)}});
map.on('click',async e=>{if(busy||won||!goli)return;setBusy(true,'finding nearest tax lot…');try{const a=await nearestLot(e.latlng);setBusy(false);if(a)guessAttrs(a);else{$('message').textContent='No tax lot at that tap.';$('detail').textContent='Try a nearby block.'}}catch(err){console.error(err);setBusy(false);$('message').textContent='Could not read that location.';$('detail').textContent='Try another tap.'}});
map.on('zoomend',()=>{$('note').textContent=map.getZoom()<15?'tap anywhere · zoom in for tax lots':'tap any visible tax lot'});
$('newGame').addEventListener('click',newGame);$('again').addEventListener('click',newGame);
newGame();
})();
</script>
</body></html>
