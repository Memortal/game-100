<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#fff9fb" />
<title>Find Goli — Brooklyn</title>
<meta name="description" content="Goli is hiding in one of Brooklyn's real tax lots. Find her as fast as you can." />
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--paper:#fff9fb;--ink:#171417;--muted:#7d7479;--line:#eadfe4;--pink:#ef9fbb;--pink2:#ffd7e5;--yellow:#f5dd82;--white:#fff;--shadow:0 8px 24px rgba(45,25,35,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body:before,body:after{content:"✿";position:fixed;z-index:20;pointer-events:none;color:var(--pink2);font-size:54px;line-height:1;opacity:.75}body:before{top:76px;left:-13px;transform:rotate(-18deg)}body:after{right:-8px;bottom:122px;transform:rotate(21deg);font-size:42px;color:#f6e8a7}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;position:relative}header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(255,249,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(234,223,228,.85);z-index:1000}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.flower{width:32px;height:32px;display:grid;place-items:center;border-radius:999px;background:var(--pink2);font-size:18px;flex:none}h1{font-size:17px;letter-spacing:.14em;margin:0;font-weight:800;white-space:nowrap}.sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{border:1px solid var(--line);background:rgba(255,255,255,.86);min-height:42px;border-radius:999px;padding:0 13px;font:inherit;font-size:12px;font-weight:750;color:var(--ink);touch-action:manipulation}.pill:active{transform:scale(.98)}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}.label{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:800}.value{font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}#map{min-height:0;background:#fffdfd;z-index:1}.leaflet-container{font:inherit;background:radial-gradient(circle at 16% 12%,rgba(239,159,187,.12) 0 2px,transparent 3px),radial-gradient(circle at 84% 18%,rgba(245,221,130,.18) 0 2px,transparent 3px),#fffdfd;background-size:90px 90px,120px 120px}.leaflet-control-zoom{border:1px solid var(--line)!important;box-shadow:none!important}.leaflet-control-zoom a{background:rgba(255,255,255,.93)!important;color:var(--ink)!important;border-bottom:1px solid var(--line)!important}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.65)!important}.leaflet-interactive{transition:fill .12s ease,stroke .12s ease}.guess-dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:var(--pink);box-shadow:0 2px 8px rgba(55,24,39,.22)}footer{z-index:1000;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(255,249,251,1),rgba(255,249,251,.95));border-top:1px solid var(--line)}.clue{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:13px 15px;box-shadow:var(--shadow)}.clue strong{font-size:18px;line-height:1.08;display:block}.clue small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.25}.distance{min-width:76px;text-align:center;border-radius:17px;padding:9px 10px;background:#fff1f6;border:1px solid #f6d3df}.distance b{font-size:23px;display:block;line-height:1;font-variant-numeric:tabular-nums}.distance span{font-size:8px;letter-spacing:.11em;font-weight:850;color:#936274}.toast{position:absolute;z-index:1500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,330px);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 20px 60px rgba(35,20,28,.16);display:none}.toast.show{display:block;animation:pop .22s ease-out}.toast .big{font-size:54px;line-height:1}.toast h2{margin:8px 0 4px;font-size:24px}.toast p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.toast button{margin-top:16px;width:100%;min-height:48px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:14px}.loading{position:absolute;z-index:1200;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:750;box-shadow:var(--shadow);display:none}.loading.show{display:block}.zoom-note{position:absolute;z-index:900;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:10px;color:var(--muted);pointer-events:none;white-space:nowrap;box-shadow:0 3px 12px rgba(30,20,25,.05)}@keyframes pop{from{transform:translate(-50%,-50%) scale(.93);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@media(min-width:760px){#app{max-width:520px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}body{background:#f6f0f3}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><header><div class="topline"><div class="brand"><div class="flower">🌸</div><div><h1>FIND GOLI</h1><div class="sub">somewhere in Brooklyn</div></div></div><button id="newGame" class="pill" type="button">NEW GOLI</button></div><div class="stats"><div class="stat"><div class="label">TIME</div><div id="time" class="value">00:00.0</div></div><div class="stat"><div class="label">TAPS</div><div id="taps" class="value">0</div></div><div class="stat"><div class="label">YOUR BEST</div><div id="best" class="value">—</div></div></div></header><div style="position:relative;min-height:0"><div id="map" aria-label="Brooklyn tax lot map"></div><div id="zoomNote" class="zoom-note">tap anywhere · zoom in to see individual tax lots</div><div id="loading" class="loading">looking through Brooklyn…</div></div><footer><div class="clue" aria-live="polite"><div><strong id="message">Tap a parcel to start.</strong><small id="detail">Each clue counts real tax lots crossed between your guess and Goli.</small></div><div class="distance"><b id="distance">?</b><span>PARCELS BETWEEN</span></div></div></footer><div id="win" class="toast" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="big">🌸</div><h2 id="winTitle">You found Goli.</h2><p id="winText"></p><button id="playAgain" type="button">FIND HER AGAIN</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.16/dist/esri-leaflet.js"></script>
<script>
(()=>{const SERVICE='https://services6.arcgis.com/yG5s3afENB5iO9fj/ArcGIS/rest/services/DTM_ETL_DAILY_A/FeatureServer/0';const $=id=>document.getElementById(id);const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:10,maxZoom:19,preferCanvas:true}).setView([40.6502,-73.9496],11);map.attributionControl.setPrefix(false);map.attributionControl.addAttribution('NYC DOF Digital Tax Map');const parcels=L.esri.featureLayer({url:SERVICE,where:"BORO='3'",minZoom:14,simplifyFactor:.55,precision:5,style:()=>({color:'#bdb1b7',weight:.55,fillColor:'#fffafc',fillOpacity:.78})}).addTo(map);let goli=null,ids=[],taps=0,running=false,won=false,start=0,raf=0,guessMarkers=[],busy=false;let best=Number(localStorage.getItem('finding-goli-best')||0)||0;if(best)$('best').textContent=fmt(best);function fmt(ms){const s=Math.max(0,ms)/1000,m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,'0')+':'+r.toFixed(1).padStart(4,'0')}function tick(){if(!running)return;$('time').textContent=fmt(performance.now()-start);raf=requestAnimationFrame(tick)}function startClock(){if(running||won)return;running=true;start=performance.now();tick()}function stopClock(){running=false;if(raf)cancelAnimationFrame(raf)}function setBusy(v,text){busy=v;$('loading').textContent=text||'looking through Brooklyn…';$('loading').classList.toggle('show',v)}function centroid(feature){const layer=L.geoJSON(feature);return layer.getBounds().getCenter()}async function json(url,params){const q=new URLSearchParams(params);const r=await fetch(url+'?'+q.toString());if(!r.ok)throw new Error('NYC map service '+r.status);const data=await r.json();if(data.error)throw new Error(data.error.message||'NYC map error');return data}async function loadIds(){const d=await json(SERVICE+'/query',{where:"BORO='3'",returnIdsOnly:'true',f:'json'});ids=(d.objectIds||[]).sort((a,b)=>a-b);if(!ids.length)throw new Error('No Brooklyn parcels returned')}async function featureById(id){const d=await json(SERVICE+'/query',{objectIds:String(id),outFields:'OBJECTID,BBL,BLOCK,LOT,BORO',returnGeometry:'true',outSR:'4326',f:'geojson'});return d.features&&d.features[0]}async function newGame(){try{setBusy(true,'hiding Goli…');stopClock();won=false;taps=0;$('taps').textContent='0';$('time').textContent='00:00.0';$('distance').textContent='?';$('message').textContent='Tap a parcel to start.';$('detail').textContent='Each clue counts real tax lots crossed between your guess and Goli.';$('win').classList.remove('show');guessMarkers.forEach(m=>map.removeLayer(m));guessMarkers=[];if(!ids.length)await loadIds();let feature=null;for(let attempt=0;attempt<8&&!feature;attempt++){const id=ids[Math.floor(Math.random()*ids.length)];feature=await featureById(id)}if(!feature)throw new Error('Could not choose a parcel');goli={id:Number(feature.properties.OBJECTID),feature,center:centroid(feature)};setBusy(false)}catch(e){console.error(e);setBusy(false);$('message').textContent='Brooklyn map is unavailable.';$('detail').textContent='Try NEW GOLI again in a moment.'}}async function nearestFeature(latlng){const d=.0011;const env=[latlng.lng-d,latlng.lat-d,latlng.lng+d,latlng.lat+d].join(',');const data=await json(SERVICE+'/query',{where:"BORO='3'",geometry:env,geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'OBJECTID,BBL,BLOCK,LOT,BORO',returnGeometry:'true',outSR:'4326',f:'geojson',resultRecordCount:'40'});const fs=data.features||[];if(!fs.length)return null;let winner=null,score=Infinity;for(const f of fs){const c=centroid(f),dx=(c.lng-latlng.lng)*Math.cos(latlng.lat*Math.PI/180),dy=c.lat-latlng.lat,s=dx*dx+dy*dy;if(s<score){score=s;winner=f}}return winner}async function crossedCount(a,b){const geometry={paths:[[[a.lng,a.lat],[b.lng,b.lat]]],spatialReference:{wkid:4326}};const d=await json(SERVICE+'/query',{where:"BORO='3'",geometry:JSON.stringify(geometry),geometryType:'esriGeometryPolyline',inSR:'4326',spatialRel:'esriSpatialRelIntersects',returnCountOnly:'true',f:'json'});return Math.max(0,(Number(d.count)||0)-2)}function addGuessMarker(c){const icon=L.divIcon({className:'',html:'<div class="guess-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});const m=L.marker(c,{icon,interactive:false}).addTo(map);guessMarkers.push(m)}async function makeGuess(feature){if(busy||won||!goli||!feature)return;try{setBusy(true,'counting parcels…');startClock();taps++;$('taps').textContent=String(taps);const id=Number(feature.properties.OBJECTID),c=centroid(feature);addGuessMarker(c);if(id===goli.id){win(c);setBusy(false);return}const n=await crossedCount(c,goli.center);$('distance').textContent=n.toLocaleString();$('message').textContent=n===0?'No parcels in between.':'Goli is '+n.toLocaleString()+' parcel'+(n===1?'':'s')+' away.';$('detail').textContent=n<5?'Very close 🌸':n<20?'You are getting warm ✿':n<70?'Closer…':'Keep searching across Brooklyn.';setBusy(false)}catch(e){console.error(e);setBusy(false);$('message').textContent='That tap did not go through.';$('detail').textContent='Tap another parcel.'}}function win(c){won=true;stopClock();const elapsed=performance.now()-start;$('time').textContent=fmt(elapsed);$('distance').textContent='0';$('message').textContent='FOUND GOLI 🌸';$('detail').textContent='You found the exact Brooklyn tax lot.';if(!best||elapsed<best){best=elapsed;localStorage.setItem('finding-goli-best',String(best));$('best').textContent=fmt(best)}$('winText').textContent=fmt(elapsed)+' · '+taps+' tap'+(taps===1?'':'s')+' · BBL '+(goli.feature.properties.BBL||'');$('win').classList.add('show');map.flyTo(c,18,{duration:.8})}parcels.on('click',e=>{if(e.layer&&e.layer.feature){L.DomEvent.stopPropagation(e);makeGuess(e.layer.feature)}});map.on('click',async e=>{if(busy||won)return;try{setBusy(true,'finding nearest tax lot…');const f=await nearestFeature(e.latlng);setBusy(false);if(f)makeGuess(f);else{$('message').textContent='That is not on a tax lot.';$('detail').textContent='Try a nearby block.'}}catch(err){console.error(err);setBusy(false)}});map.on('zoomend',()=>{$('zoomNote').textContent=map.getZoom()<14?'tap anywhere · zoom in to see individual tax lots':'tap any visible tax lot'});$('newGame').addEventListener('click',newGame);$('playAgain').addEventListener('click',newGame);newGame()})();
</script>
</body>
</html>
